name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to (re)build and publish, e.g. v1.4.0'
        required: true

# The version being released: the pushed tag, or the tag chosen for a manual run
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-and-push-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        # Read the checked-out release commit, not the commit the workflow was triggered from
        context: git
        images: theprantadutta/filerunner-backend
        # latest for easy deploys, plus exact tags for pinning: 1.4.0, 1.4, and sha-<commit>.
        # Manual rebuilds of an older tag refresh its pinned tags but never move latest back.
        tags: |
          type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
          type=sha
          type=raw,value=latest,enable=${{ github.event_name == 'push' }}

    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-and-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        # Read the checked-out release commit, not the commit the workflow was triggered from
        context: git
        images: theprantadutta/filerunner-frontend
        # latest for easy deploys, plus exact tags for pinning: 1.4.0, 1.4, and sha-<commit>.
        # Manual rebuilds of an older tag refresh its pinned tags but never move latest back.
        tags: |
          type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
          type=sha
          type=raw,value=latest,enable=${{ github.event_name == 'push' }}

    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
